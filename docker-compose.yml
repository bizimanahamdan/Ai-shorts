version: '3.8'

services:
  ai-shorts-bot:
    build: .
    container_name: ai-shorts-bot
    restart: unless-stopped
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./downloads:/app/downloads
      - ./exports:/app/exports
      - ./thumbnails:/app/thumbnails
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
